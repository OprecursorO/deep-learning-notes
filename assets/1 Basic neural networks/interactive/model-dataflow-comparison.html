<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNN、RNN、Transformer 的数据流结构对比</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#526176;--line:#d5dce7;--paper:#fff;--wash:#f5f7fb;--blue:#2458d6;--blue-soft:#eaf0ff;--orange:#a95708;--orange-soft:#fff3df;--green:#187647;--green-soft:#e8f5ed}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}main{max-width:1040px;margin:auto;padding:24px 18px 44px}h1{font-size:28px;margin:0 0 6px}.intro{color:var(--muted);margin:0 0 16px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls button{font:inherit;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}.controls button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:white}.controls button:focus-visible{outline:3px solid #e3a522;outline-offset:2px}.panel{padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:9px}.diagram{min-height:310px;overflow:auto}.diagram svg{display:block;width:100%;min-width:720px;height:auto}.diagram text{font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:var(--ink)}.diagram .small{font-size:13px;fill:var(--muted)}.diagram .label{font-size:15px;font-weight:650}.diagram .cell{stroke:#bac5d5;stroke-width:1}.diagram .base{fill:#f5f7fb}.diagram .focus{fill:#eaf0ff;stroke:#2458d6;stroke-width:2}.diagram .warm{fill:#fff3df;stroke:#d48a31;stroke-width:2}.diagram .out{fill:#e8f5ed;stroke:#61a77e;stroke-width:1.5}.diagram .link{fill:none;stroke:#526176;stroke-width:2;marker-end:url(#arrow)}.caption{padding:12px 14px;background:var(--wash);border-left:4px solid var(--blue);margin-top:12px}.fallback{color:var(--muted);font-size:14px}.key{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted);margin:10px 0}.swatch{display:inline-block;width:13px;height:13px;border:1px solid #aeb7c7;vertical-align:-2px;margin-right:4px}.blue{background:var(--blue-soft)}.orange{background:var(--orange-soft)}.green{background:var(--green-soft)}
</style>
</head>
<body><main>
<h1>CNN、RNN、Transformer：同样是神经网络，数据怎样组织？</h1>
<p class="intro">切换模型，观察真正的数据对象和连接关系。蓝色表示正在处理的输入/状态，橙色突出共享计算单元或当前 query，绿色表示生成的特征或输出。图为确定性的教学结构示意。</p>
<div class="controls" role="group" aria-label="选择模型计算结构"><button type="button" data-model="cnn" aria-pressed="true">CNN：空间窗口</button><button type="button" data-model="rnn" aria-pressed="false">RNN：时间递归</button><button type="button" data-model="transformer" aria-pressed="false">Transformer：token 交互</button></div>
<section class="panel"><div class="diagram" id="diagram" role="img" aria-label="CNN 空间窗口与卷积核共享结构"></div><div class="key"><span><i class="swatch blue"></i>输入 / 当前对象</span><span><i class="swatch orange"></i>当前窗口 / 共享单元 / 查询</span><span><i class="swatch green"></i>输出 / 汇总结果</span></div><div class="caption" id="caption" aria-live="polite"></div></section>
<p class="fallback">静态读法：CNN 在二维空间移动局部窗口并复用同一组 filter；RNN 沿时间顺序传递隐藏状态并复用 recurrent cell；Transformer 在同一层构造 query-key 关系，并由权重读取 value。示意没有计算真实训练模型的精度。</p>
</main>
<script>
const diagram=document.querySelector('#diagram'),caption=document.querySelector('#caption');
const models={
 cnn:{label:'CNN 空间结构：局部 patch → 共享 kernel → feature map',caption:'同一组 2×2 filter 在多个空间位置重复使用。左图蓝框是当前输入 patch，右图蓝框对应它产生的一个输出格；窗口可以移到相邻位置，因此不同输出位置之间通常可并行计算。',svg:`<svg viewBox="0 0 920 330" role="img" aria-label="四乘四输入特征图上的二乘二卷积窗口、共享 filter 和输出特征图"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#526176"/></marker></defs><text x="30" y="30" class="label">输入 feature map（示意像素）</text><text x="455" y="30" class="label">共享 filter：在不同位置重复调用</text><text x="735" y="30" class="label">输出 feature map</text>${Array.from({length:16},(_,i)=>{const r=Math.floor(i/4),c=i%4,x=40+c*58,y=52+r*54,active=r<2&&c<2;return `<rect x="${x}" y="${y}" width="54" height="50" rx="4" class="cell ${active?'focus':'base'}"/><text x="${x+27}" y="${y+30}" text-anchor="middle">${i+1}</text>`}).join('')}<rect x="40" y="52" width="112" height="104" rx="4" fill="none" stroke="#2458d6" stroke-width="3"/><path d="M290 110H390" class="link"/><rect x="410" y="72" width="126" height="112" rx="5" fill="#fff3df" stroke="#d48a31" stroke-width="2"/><text x="473" y="96" text-anchor="middle" class="small">W（所有位置共用）</text>${[[1,0],[0,1]].flatMap((row,r)=>row.map((v,c)=>`<rect x="${421+c*54}" y="${108+r*38}" width="46" height="31" rx="3" class="cell warm"/><text x="${444+c*54}" y="${129+r*38}" text-anchor="middle">${v}</text>`)).join('')}<path d="M555 110H660" class="link"/><text x="605" y="92" text-anchor="middle" class="small">逐项乘加</text>${Array.from({length:9},(_,i)=>{const r=Math.floor(i/3),c=i%3,x=700+c*58,y=60+r*58,active=i===0;return `<rect x="${x}" y="${y}" width="52" height="52" rx="4" class="cell ${active?'focus':'out'}"/><text x="${x+26}" y="${y+31}" text-anchor="middle">${[7,9,11,15,17,19,23,25,27][i]}</text>`}).join('')}<path d="M152 155 C250 235 610 240 700 90" fill="none" stroke="#d48a31" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="390" y="265" text-anchor="middle" class="small">移动窗口 → 使用同一个 W → 产生另一个位置的输出</text></svg>`},
 rnn:{label:'RNN 时间结构：输入序列与隐藏状态依次传递',caption:'每个时间步读入一个新的 xₜ；当前状态 hₜ 同时依赖当前输入与上一步状态 hₜ₋₁。循环单元的参数 W 在每个时间步共享，但计算有先后依赖：hₜ₊₁ 必须等 hₜ 产生。',svg:`<svg viewBox="0 0 920 330" role="img" aria-label="RNN 三个时间步的输入、共享循环单元和隐藏状态依赖图"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#526176"/></marker></defs><text x="35" y="34" class="label">时间 t →</text>${[0,1,2].map(i=>{const x=100+i*265;return `<text x="${x+74}" y="65" text-anchor="middle" class="small">时间步 t=${i+1}</text><rect x="${x}" y="85" width="95" height="54" rx="7" class="cell focus"/><text x="${x+47}" y="118" text-anchor="middle">输入 x${i+1}</text><rect x="${x+125}" y="85" width="100" height="78" rx="7" class="cell warm"/><text x="${x+175}" y="114" text-anchor="middle">RNN cell</text><text x="${x+175}" y="139" text-anchor="middle" class="small">同一组 W</text><rect x="${x+130}" y="205" width="90" height="52" rx="7" class="cell out"/><text x="${x+175}" y="237" text-anchor="middle">状态 h${i+1}</text><path d="M${x+95} 112H${x+125}" class="link"/><path d="M${x+175} 163V205" class="link"/>`}).join('')}<path d="M320 231H490" class="link"/><path d="M585 231H755" class="link"/><text x="458" y="294" text-anchor="middle" class="small">hₜ₋₁ 是下一步的输入之一：状态逐步向前传递，不能跳过前一状态</text></svg>`},
 transformer:{label:'Transformer self-attention：query 对多个 key 建立读取权重',caption:'每个 query（当前行）与每个 key（列）形成一个关系分数；softmax 后，一行权重用于混合各位置的 value。图中的 token 和权重是便于看结构的教学示意，关系由当前输入决定；该结构不是简单的单向时间链。',svg:`<svg viewBox="0 0 920 330" role="img" aria-label="三个 token 的 query-key 注意力权重矩阵与 value 加权输出"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#526176"/></marker></defs><text x="45" y="35" class="label">token 表示并行投影</text>${['I','love','AI'].map((t,i)=>{const y=62+i*68;return `<rect x="45" y="${y}" width="92" height="48" rx="6" class="cell focus"/><text x="91" y="${y+29}" text-anchor="middle">${t}</text><path d="M137 ${y+24}H195" class="link"/><rect x="205" y="${y}" width="86" height="48" rx="6" class="cell warm"/><text x="248" y="${y+29}" text-anchor="middle">Q,K,V</text>`}).join('')}<text x="375" y="35" class="label">注意力权重 α（query × key）</text><text x="436" y="58" text-anchor="middle" class="small">K: I</text><text x="496" y="58" text-anchor="middle" class="small">love</text><text x="556" y="58" text-anchor="middle" class="small">AI</text>${[[.7,.2,.1],[.1,.7,.2],[.15,.25,.6]].flatMap((row,r)=>row.map((v,c)=>{const x=407+c*60,y=70+r*57;return `<rect x="${x}" y="${y}" width="56" height="52" rx="3" fill="rgba(36,88,214,${v})" stroke="#aebbd0"/><text x="${x+28}" y="${y+31}" text-anchor="middle">${v.toFixed(2)}</text>`})).join('')}<text x="382" y="102" text-anchor="end" class="small">Q:I</text><text x="382" y="159" text-anchor="end" class="small">love</text><text x="382" y="216" text-anchor="end" class="small">AI</text><path d="M590 154H670" class="link"/><rect x="685" y="115" width="190" height="82" rx="7" class="cell out"/><text x="780" y="145" text-anchor="middle" class="label">weighted sum of V</text><text x="780" y="172" text-anchor="middle" class="small">contextualized tokens</text><text x="472" y="275" text-anchor="middle" class="small">矩阵每行对应一个 query；一行的权重加总为 1，再用于读取所有 value</text></svg>`}
};
function setModel(name){const model=models[name];let svg=model.svg;const examples={cnn:'从左上角手算：1×1 + 2×0 + 5×0 + 6×1 = 7；同一个 filter 移到右边，仍按相同权重计算。',rnn:'读箭头方向：先由 x₁ 和初始状态得到 h₁，再把 h₁ 交给下一步；参数共享不等于时间步可以乱序。',transformer:'固定示例的第一行 query 是 “I”，权重为 [0.70, 0.20, 0.10]。它读取 V_I=[1,0]、V_love=[0,2]、V_AI=[2,1]，加权后得到 context=[0.90, 0.50]；这些数是教学构造，不是训练结果。'};if(name==='transformer'){svg=svg.replace('<text x="780" y="172" text-anchor="middle" class="small">contextualized tokens</text>','<text x="780" y="172" text-anchor="middle" class="small">example context: [0.90, 0.50]</text>');svg=svg.replace('<text x="472" y="275" text-anchor="middle" class="small">矩阵每行对应一个 query；一行的权重加总为 1，再用于读取所有 value</text>','<text x="460" y="275" text-anchor="middle" class="small">V_I=[1,0]；V_love=[0,2]；V_AI=[2,1]</text><text x="460" y="298" text-anchor="middle" class="small">Query “I”：0.70[1,0] + 0.20[0,2] + 0.10[2,1] = [0.90,0.50]</text>')}diagram.innerHTML=svg;diagram.setAttribute('aria-label',model.label);caption.textContent=model.caption+' '+examples[name];document.querySelectorAll('button[data-model]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.model===name)))}
document.querySelectorAll('button[data-model]').forEach(button=>button.addEventListener('click',()=>setModel(button.dataset.model)));setModel('cnn');
</script></body></html>
