<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">Max pooling 把四乘四 feature map 压缩为二乘二</title>
<desc id="desc">左侧四乘四输入按二乘二分区，每个分区取最大值，右侧得到六、二、五、九组成的二乘二输出。</desc>
<rect width="900" height="310" rx="14" fill="#fff"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#172033">
<text x="220" y="34" text-anchor="middle" font-size="19" font-weight="700">输入 activation map（4 × 4）</text>
<text x="700" y="34" text-anchor="middle" font-size="19" font-weight="700">输出（2 × 2）</text>
<g font-size="19" text-anchor="middle" font-weight="600">
<rect x="90" y="58" width="132" height="88" rx="8" fill="#e8f1fb" stroke="#2166a5" stroke-width="2"/><text x="156" y="94">1　3</text><text x="156" y="126">4　6</text>
<rect x="230" y="58" width="132" height="88" rx="8" fill="#fff2df" stroke="#b85c00" stroke-width="2"/><text x="296" y="94">2　0</text><text x="296" y="126">1　2</text>
<rect x="90" y="152" width="132" height="88" rx="8" fill="#fff2df" stroke="#b85c00" stroke-width="2"/><text x="156" y="188">5　2</text><text x="156" y="220">3　1</text>
<rect x="230" y="152" width="132" height="88" rx="8" fill="#e8f1fb" stroke="#2166a5" stroke-width="2"/><text x="296" y="188">7　8</text><text x="296" y="220">9　4</text>
<path d="M395 151H500" fill="none" stroke="#526173" stroke-width="3"/><path d="M490 142L504 151 490 160" fill="none" stroke="#526173" stroke-width="3"/>
<text x="446" y="133" font-size="14" fill="#536174">每块取最大</text>
<rect x="590" y="83" width="96" height="70" rx="8" fill="#e8f1fb" stroke="#2166a5" stroke-width="2"/><text x="638" y="127">6</text>
<rect x="692" y="83" width="96" height="70" rx="8" fill="#fff2df" stroke="#b85c00" stroke-width="2"/><text x="740" y="127">2</text>
<rect x="590" y="159" width="96" height="70" rx="8" fill="#fff2df" stroke="#b85c00" stroke-width="2"/><text x="638" y="203">5</text>
<rect x="692" y="159" width="96" height="70" rx="8" fill="#e8f1fb" stroke="#2166a5" stroke-width="2"/><text x="740" y="203">9</text>
</g>
<text x="450" y="278" text-anchor="middle" font-size="15" fill="#536174">window = 2 × 2，stride = 2；一个局部窗口对应一个输出值</text>
</g></svg>
