<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
<title id="title">LSTM 的 cell state 更新与 hidden state 输出</title>
<desc id="desc">旧 cell state 乘以 forget gate，与候选内容乘以 input gate 相加得到新 cell state；新 cell state 经 tanh 后乘以 output gate 得到 hidden state。</desc>
<defs><marker id="lstm-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#526173"/></marker></defs>
<rect width="1080" height="390" rx="14" fill="#fff"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#172033">
<text x="540" y="32" text-anchor="middle" font-size="19" font-weight="700">LSTM 把“保留旧记忆、写入新内容、对外输出”分开控制</text>
<rect x="350" y="48" width="380" height="55" rx="10" fill="#e8f1fb" stroke="#2166a5" stroke-width="2"/>
<text x="540" y="72" text-anchor="middle" font-size="16" font-weight="700">当前输入 xₜ + 上一步输出 hₜ₋₁</text><text x="540" y="92" text-anchor="middle" font-size="13">共同计算各 gate 与候选内容</text>
<g fill="#fff2df" stroke="#b85c00" stroke-width="1.7"><rect x="140" y="126" width="120" height="42" rx="9"/><rect x="360" y="126" width="120" height="42" rx="9"/><rect x="730" y="126" width="120" height="42" rx="9"/></g>
<g text-anchor="middle" font-size="15"><text x="200" y="153">forget gate fₜ</text><text x="420" y="153">input gate iₜ</text><text x="790" y="153">output gate oₜ</text></g>
<g stroke="#9a6a34" stroke-width="1.6" stroke-dasharray="5 5" fill="none"><path d="M450 103L200 123"/><path d="M520 103L420 123"/><path d="M630 103L790 123"/></g>
<g stroke="#526173" stroke-width="2.3" fill="none" marker-end="url(#lstm-arrow)">
<path d="M145 229H275"/><path d="M220 324H275"/><path d="M330 229H435"/><path d="M330 324H435"/><path d="M480 229H568"/><path d="M615 229H690"/><path d="M765 229H845"/><path d="M905 229H965"/>
<path d="M200 168V211H295V219"/><path d="M420 168V304H295V315"/><path d="M790 168V203H875V219"/>
</g>
<g fill="#e8f1fb" stroke="#2166a5" stroke-width="2">
<rect x="30" y="207" width="115" height="44" rx="9"/><rect x="30" y="302" width="190" height="44" rx="9"/><rect x="690" y="207" width="75" height="44" rx="9"/><rect x="965" y="207" width="85" height="44" rx="9"/>
</g>
<g text-anchor="middle" font-size="15"><text x="87" y="235">旧记忆 Cₜ₋₁</text><text x="125" y="330">候选内容 C̃ₜ</text><text x="727" y="235">新记忆 Cₜ</text><text x="1007" y="235">输出 hₜ</text></g>
<g fill="#fff" stroke="#526173" stroke-width="2"><circle cx="295" cy="229" r="21"/><circle cx="295" cy="324" r="21"/><circle cx="457" cy="229" r="22"/><rect x="845" y="207" width="60" height="44" rx="9"/></g>
<g text-anchor="middle" font-size="17" font-weight="700"><text x="295" y="235">×</text><text x="295" y="330">×</text><text x="457" y="235">+</text><text x="875" y="235">× oₜ</text></g>
<text x="875" y="273" text-anchor="middle" font-size="13" fill="#536174">tanh(Cₜ) × oₜ</text>
<g text-anchor="middle" font-size="13" fill="#536174"><text x="295" y="267">fₜ × Cₜ₋₁</text><text x="295" y="363">iₜ × C̃ₜ</text><text x="540" y="284" font-size="14" fill="#172033">Cₜ = fₜ ⊙ Cₜ₋₁ + iₜ ⊙ C̃ₜ</text></g>
</g></svg>
