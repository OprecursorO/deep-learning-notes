<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc">
<title id="title">RNN 沿时间展开但共享同一组参数</title>
<desc id="desc">三个时间步使用同一个 RNN cell。旧 hidden state 沿水平方向传递，每一步读取当前输入；同一组参数连接到所有时间步。</desc>
<defs><marker id="rnn-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#526173"/></marker></defs>
<rect width="1040" height="340" rx="14" fill="#fff"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#172033">
<text x="520" y="33" text-anchor="middle" font-size="19" font-weight="700">一套参数 θ 在每个 time step 重复使用</text>
<rect x="335" y="48" width="370" height="44" rx="9" fill="#e8f1fb" stroke="#2166a5" stroke-width="2"/>
<text x="520" y="76" text-anchor="middle" font-size="16">θ = {Wₓₕ, Wₕₕ, bₕ, Wₕᵧ, bᵧ}</text>
<g stroke="#7794b2" stroke-width="1.5" stroke-dasharray="5 5"><path d="M410 92V118"/><path d="M520 92V118"/><path d="M630 92V118"/></g>
<g fill="#f8fafc" stroke="#526173" stroke-width="2">
<rect x="155" y="125" width="190" height="84" rx="12"/><rect x="425" y="125" width="190" height="84" rx="12"/><rect x="695" y="125" width="190" height="84" rx="12"/>
</g>
<g text-anchor="middle">
<text x="250" y="156" font-size="17" font-weight="700">RNN cell</text><text x="250" y="184" font-size="15">同一组 θ</text>
<text x="520" y="156" font-size="17" font-weight="700">RNN cell</text><text x="520" y="184" font-size="15">同一组 θ</text>
<text x="790" y="156" font-size="17" font-weight="700">RNN cell</text><text x="790" y="184" font-size="15">同一组 θ</text>
</g>
<g stroke="#526173" stroke-width="2.5" fill="none" marker-end="url(#rnn-arrow)">
<path d="M102 167H150"/><path d="M350 167H420"/><path d="M620 167H690"/><path d="M890 167H940"/>
<path d="M250 263V214"/><path d="M520 263V214"/><path d="M790 263V214"/>
</g>
<g fill="#fff" stroke="#2166a5" stroke-width="2"><rect x="15" y="143" width="87" height="48" rx="10"/><rect x="940" y="143" width="87" height="48" rx="10"/></g>
<g text-anchor="middle" font-size="16"><text x="58" y="173">h₀</text><text x="983" y="173">h₃</text><text x="385" y="151">h₁</text><text x="655" y="151">h₂</text><text x="250" y="291">x₁</text><text x="520" y="291">x₂</text><text x="790" y="291">x₃</text></g>
<g text-anchor="middle" font-size="14" fill="#536174"><text x="250" y="229">time step 1</text><text x="520" y="229">time step 2</text><text x="790" y="229">time step 3</text></g>
<text x="520" y="326" text-anchor="middle" font-size="14" fill="#536174">改变的是输入 xₜ 和状态 hₜ；参数 θ 不复制，只重复调用。</text>
</g></svg>
