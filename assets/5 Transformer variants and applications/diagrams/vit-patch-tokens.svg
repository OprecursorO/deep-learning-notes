<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Vision Transformer patch to token pipeline</title>
  <desc id="desc">An image is divided into patches, each patch is flattened and projected into a token, and tokens enter a Transformer sequence.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#172033}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#5b6475}.box{stroke:#475569;stroke-width:2}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9z" fill="#475569"/></marker></defs>
  <rect width="960" height="300" rx="14" fill="#f8fafc"/>
  <text x="100" y="32" class="h" text-anchor="middle">image</text>
  <g transform="translate(35 60)"><rect width="130" height="130" fill="#dbeafe" class="box"/><path d="M32.5 0v130M65 0v130M97.5 0v130M0 32.5h130M0 65h130M0 97.5h130" stroke="#2563eb" stroke-width="2"/><circle cx="38" cy="42" r="16" fill="#f97316"/><path d="M78 105l30-44 18 40z" fill="#16a34a"/></g>
  <line x1="165" y1="125" x2="245" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="305" y="32" class="h" text-anchor="middle">patches</text><g transform="translate(245 75)"><rect width="120" height="100" fill="#fff" class="box"/><rect x="12" y="12" width="42" height="34" fill="#fed7aa"/><rect x="66" y="12" width="42" height="34" fill="#bfdbfe"/><rect x="12" y="54" width="42" height="34" fill="#bbf7d0"/><rect x="66" y="54" width="42" height="34" fill="#ddd6fe"/></g>
  <line x1="365" y1="125" x2="445" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="32" class="h" text-anchor="middle">flatten + project</text><g transform="translate(445 66)"><rect width="130" height="120" fill="#fff" class="box"/><text x="65" y="32" text-anchor="middle">patch 1 → z₁</text><text x="65" y="61" text-anchor="middle">patch 2 → z₂</text><text x="65" y="90" text-anchor="middle">... → zₙ</text></g>
  <line x1="575" y1="125" x2="655" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="765" y="32" class="h" text-anchor="middle">Transformer sequence</text><g transform="translate(655 75)"><rect width="220" height="100" fill="#dcfce7" class="box"/><text x="110" y="43" text-anchor="middle">[CLS] z₁ z₂ ... zₙ</text><text x="110" y="70" text-anchor="middle" class="s">+ positional information</text></g>
  <text x="480" y="255" class="s" text-anchor="middle">A patch is a visual token; patch size controls sequence length and attention cost.</text>
</svg>
