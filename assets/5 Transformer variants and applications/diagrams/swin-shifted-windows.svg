<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Swin shifted window communication</title>
  <desc id="desc">The first layer uses non-overlapping windows; the next layer shifts the partition so neighboring windows exchange information.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#172033}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#5b6475}.grid{fill:#fff;stroke:#475569;stroke-width:2}.cell{stroke:#fff;stroke-width:1}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9z" fill="#475569"/></marker></defs>
  <rect width="960" height="340" rx="14" fill="#f8fafc"/>
  <text x="220" y="34" class="h" text-anchor="middle">Layer 1: non-overlapped windows</text>
  <g transform="translate(90 65)"><rect width="260" height="200" class="grid"/><path d="M130 0v200M0 100h260" stroke="#2563eb" stroke-width="5"/><path d="M32.5 0v200M65 0v200M97.5 0v200M162.5 0v200M195 0v200M227.5 0v200M0 50h260M0 150h260" stroke="#cbd5e1"/></g>
  <text x="220" y="292" class="s" text-anchor="middle">each query attends inside one regular window</text>
  <line x1="380" y1="165" x2="565" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="472" y="146" class="s" text-anchor="middle">shift partition</text>
  <text x="740" y="34" class="h" text-anchor="middle">Layer 2: shifted windows</text>
  <g transform="translate(610 65)"><rect width="260" height="200" class="grid"/><path d="M65 0v200M195 0v200M0 50h260M0 150h260" stroke="#16a34a" stroke-width="5"/><path d="M130 0v200M0 100h260" stroke="#cbd5e1" stroke-dasharray="5 5"/><path d="M32.5 0v200M97.5 0v200M162.5 0v200M227.5 0v200" stroke="#cbd5e1"/></g>
  <text x="740" y="292" class="s" text-anchor="middle">neighbors cross old boundaries</text>
</svg>
