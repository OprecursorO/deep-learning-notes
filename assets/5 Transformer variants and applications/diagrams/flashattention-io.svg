<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention IO-aware data flow</title>
  <desc id="desc">Standard attention writes a full score matrix to high bandwidth memory; tiled exact attention keeps blocks in on-chip SRAM and streams the result.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#172033}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#5b6475}.box{stroke:#475569;stroke-width:2}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9z" fill="#475569"/></marker></defs>
  <rect width="960" height="300" rx="14" fill="#f8fafc"/>
  <text x="235" y="32" class="h" text-anchor="middle">Standard attention</text>
  <rect x="30" y="68" width="120" height="54" rx="8" class="box" fill="#dbeafe"/><text x="90" y="101" text-anchor="middle">Q, K, V</text>
  <rect x="190" y="68" width="140" height="54" rx="8" class="box" fill="#bfdbfe"/><text x="260" y="101" text-anchor="middle">full N × N matrix</text>
  <rect x="370" y="68" width="140" height="54" rx="8" class="box" fill="#fed7aa"/><text x="440" y="101" text-anchor="middle">HBM write/read</text>
  <line x1="150" y1="95" x2="190" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="330" y1="95" x2="370" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="235" y="150" class="s" text-anchor="middle">exact math, expensive intermediate traffic</text>
  <text x="725" y="32" class="h" text-anchor="middle">Tiled exact attention</text>
  <rect x="540" y="68" width="110" height="54" rx="8" class="box" fill="#dbeafe"/><text x="595" y="101" text-anchor="middle">Q, K, V</text>
  <rect x="690" y="68" width="130" height="54" rx="8" class="box" fill="#dcfce7"/><text x="755" y="101" text-anchor="middle">SRAM tile</text>
  <rect x="860" y="68" width="70" height="54" rx="8" class="box" fill="#bbf7d0"/><text x="895" y="101" text-anchor="middle">Y</text>
  <line x1="650" y1="95" x2="690" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="820" y1="95" x2="860" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M755 135v45H595v-45" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/><text x="755" y="205" class="s" text-anchor="middle">stream blocks; keep running softmax statistics</text>
  <text x="480" y="268" class="s" text-anchor="middle">Same exact result; fewer HBM ↔ SRAM transfers.</text>
</svg>
