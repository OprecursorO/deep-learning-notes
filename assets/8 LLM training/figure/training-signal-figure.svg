<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">LLM training：同一个 base model 如何改变行为</title>
<desc id="desc">三阶段图：预训练从 token 分布开始，SFT 用示范改变任务行为，偏好优化比较 chosen 与 rejected；底部显示每阶段改变的监督信号。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2637a8"/></marker><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#242938}.ey{font:600 13px ui-monospace,monospace;letter-spacing:1px;fill:#2637a8}.h{font:700 22px system-ui}.n{font:700 15px system-ui}.s{font:13px system-ui;fill:#657084}.box{fill:#fff;stroke:#d9ddea;stroke-width:2}.blue{fill:#eef0ff;stroke:#2637a8;stroke-width:2}.green{fill:#efffc6;stroke:#7b9400;stroke-width:2}.orange{fill:#fff3cf;stroke:#e7a326;stroke-width:2}.line{stroke:#2637a8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="500" fill="#f7f8fc"/><text x="32" y="38" class="ey">LECTURE 11 · SAME OBJECT, DIFFERENT SUPERVISION</text><text x="32" y="72" class="h">训练阶段改变的不是同一个“能力分数”，而是监督信号</text>
<rect x="32" y="105" width="330" height="270" rx="12" class="box"/><text x="55" y="140" class="ey">01 · PRETRAINING</text><text x="55" y="170" class="n">token 分布</text><rect x="62" y="205" width="68" height="38" rx="6" class="box"/><text x="82" y="229" class="s">The</text><rect x="138" y="205" width="82" height="38" rx="6" class="box"/><text x="153" y="229" class="s">model</text><rect x="228" y="205" width="82" height="38" rx="6" class="green"/><text x="241" y="229" class="s">next token</text><path d="M220 224H228" class="line"/><text x="55" y="286" class="s">signal：next-token loss</text><text x="55" y="314" class="s">改变：语言、知识、模式</text><rect x="55" y="335" width="280" height="24" rx="5" class="blue"/><text x="119" y="352" class="s">base model</text>
<path d="M362 240H410" class="line"/><rect x="410" y="105" width="330" height="270" rx="12" class="box"/><text x="433" y="140" class="ey">02 · SFT / LORA</text><text x="433" y="170" class="n">任务行为</text><rect x="442" y="205" width="118" height="38" rx="6" class="box"/><text x="466" y="229" class="s">prompt</text><path d="M560 224H590" class="line"/><rect x="590" y="205" width="118" height="38" rx="6" class="green"/><text x="606" y="229" class="s">示范答案</text><text x="433" y="286" class="s">signal：prompt → response</text><text x="433" y="314" class="s">改变：格式、任务、指令跟随</text><rect x="433" y="335" width="280" height="24" rx="5" class="blue"/><text x="523" y="352" class="s">ΔW = BA</text>
<path d="M740 240H788" class="line"/><rect x="788" y="105" width="380" height="270" rx="12" class="box"/><text x="811" y="140" class="ey">03 · PREFERENCE</text><text x="811" y="170" class="n">选择标准</text><rect x="820" y="205" width="145" height="38" rx="6" class="green"/><text x="843" y="229" class="s">chosen y⁺</text><text x="977" y="229" class="s">vs.</text><rect x="1007" y="205" width="115" height="38" rx="6" class="orange"/><text x="1022" y="229" class="s">rejected</text><path d="M965 224H1000" class="line"/><text x="811" y="286" class="s">signal：偏好对 / reward</text><text x="811" y="314" class="s">改变：哪个回答更合意</text><rect x="811" y="335" width="310" height="24" rx="5" class="blue"/><text x="904" y="352" class="s">RLHF 或 DPO</text>
<text x="32" y="432" class="s">读图：同一个 base model 沿着输入 → 监督信号 → 行为结果前进；每一步改变的对象不同，不能把所有改善都叫作“增加知识”。</text>
</svg>
