<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Modern decoder block：结构、局部机制与系统代价</title>
<desc id="desc">左侧是 token 经过 attention、SwiGLU 或 MoE 后回到 residual stream 的总览；中间是 router 选择 expert 的局部机制；右侧是 KV cache、HBM traffic 和稳定性的系统后果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2637a8"/></marker><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#242938}.ey{font:600 13px ui-monospace,monospace;letter-spacing:1px;fill:#2637a8}.h{font:700 22px system-ui}.b{font:600 15px system-ui}.s{font:13px system-ui;fill:#657084}.box{fill:#fff;stroke:#d9ddea;stroke-width:2}.blue{fill:#eef0ff;stroke:#2637a8;stroke-width:2}.green{fill:#efffc6;stroke:#7b9400;stroke-width:2}.orange{fill:#fff3cf;stroke:#e7a326;stroke-width:2}.line{stroke:#7d8495;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#9a9bcf;stroke-width:2;stroke-dasharray:6 5;fill:none}</style></defs>
<rect width="1200" height="520" fill="#f7f8fc"/>
<text x="32" y="38" class="ey">LECTURE 10 · SOURCE-GROUNDED TEACHING FIGURE</text><text x="32" y="72" class="h">一个结构选择，改变哪一个张量和系统资源？</text>
<rect x="32" y="105" width="490" height="360" rx="12" class="box"/><text x="54" y="140" class="ey">01 · ARCHITECTURE OVERVIEW</text><text x="54" y="170" class="b">主路径：token → attention → FFN → next token</text>
<rect x="62" y="225" width="100" height="52" rx="7" class="box"/><text x="86" y="256" class="b">token x</text><path d="M162 251H208" class="line"/>
<rect x="208" y="205" width="118" height="92" rx="7" class="blue"/><text x="238" y="240" class="b">Attention</text><text x="226" y="264" class="s">Q · K · V</text><path d="M326 251H370" class="line"/>
<rect x="370" y="205" width="118" height="92" rx="7" class="green"/><text x="394" y="240" class="b">SwiGLU /</text><text x="410" y="263" class="b">MoE</text><path d="M267 205V175H540" class="dash"/><path d="M429 297V335H540" class="dash"/><text x="350" y="164" class="s">KV state</text><text x="444" y="355" class="s">capacity / routing</text>
<text x="62" y="395" class="s">residual stream：子层输出回到同一条表示流</text><rect x="62" y="410" width="426" height="26" rx="5" class="blue"/><text x="196" y="429" class="s">residual + norm + position</text>
<path d="M522 285H583" class="line"/><rect x="583" y="105" width="275" height="360" rx="12" class="box"/><text x="605" y="140" class="ey">02 · LOCAL MECHANISM</text><text x="605" y="170" class="b">一个 token 的 MoE 路由</text><rect x="685" y="190" width="80" height="36" rx="6" class="box"/><text x="704" y="213" class="s">token x</text><path d="M725 226V260" class="line"/><rect x="675" y="260" width="100" height="40" rx="6" class="orange"/><text x="704" y="285" class="b">Router</text><path d="M700 300L635 350M725 300L700 350M750 300L765 350M775 300L830 350" class="line"/><rect x="605" y="350" width="62" height="38" rx="6" class="green"/><text x="627" y="374" class="s">E1</text><rect x="670" y="350" width="62" height="38" rx="6" class="green"/><text x="692" y="374" class="s">E2</text><rect x="735" y="350" width="62" height="38" rx="6" class="box"/><text x="757" y="374" class="s">E3</text><rect x="800" y="350" width="62" height="38" rx="6" class="box"/><text x="822" y="374" class="s">E4</text><text x="605" y="420" class="s">top-k 只激活部分 expert；负载均衡决定真实吞吐</text>
<path d="M858 285H920" class="line"/><rect x="920" y="105" width="248" height="360" rx="12" class="box"/><text x="942" y="140" class="ey">03 · SYSTEM CONSEQUENCE</text><text x="942" y="170" class="b">读图结论</text><rect x="942" y="195" width="204" height="58" rx="6" class="blue"/><text x="958" y="220" class="b">KV cache</text><text x="958" y="242" class="s">GQA / MLA 压缩 decode 状态</text><rect x="942" y="270" width="204" height="58" rx="6" class="orange"/><text x="958" y="295" class="b">HBM traffic</text><text x="958" y="317" class="s">FlashAttention 减少搬运</text><rect x="942" y="345" width="204" height="58" rx="6" class="green"/><text x="958" y="370" class="b">稳定性</text><text x="958" y="392" class="s">Pre-Norm / residual</text>
</svg>
